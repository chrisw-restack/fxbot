name: Trading pipeline tests
on: [push, pull_request]
jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-backtest.lock
      - run: python -m pip install -r requirements-backtest.lock
      - run: python -m unittest discover -s tests -v
